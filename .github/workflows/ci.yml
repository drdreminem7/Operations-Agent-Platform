name: CI

on:
    push:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest

        env:
            DATABASE_URL: postgresql+psycopg://operations:operations@localhost:5433/operations

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: operations
                    POSTGRES_USER: operations
                    POSTGRES_PASSWORD: operations
                ports:
                    - "5433:5432"
                options: >-
                    --health-cmd "pg_isready -U operations -d operations"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Set up uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true

            - name: Install locked dependencies
              run: uv sync --locked --group experiment

            - name: Lint
              run: uv run ruff check .

            - name: Type check
              run: uv run mypy

            - name: Apply database migrations
              run: uv run alembic upgrade head

            - name: Run tests
              run: uv run --group experiment pytest

            - name: Evaluate agent regression
              run: PYTHONPATH=src uv run python -m app.evaluation --baseline evals/baseline.json > evaluation-report.json

            - name: Smoke test isolated runtime stack
              run: |
                  docker compose -p oap-ci-smoke -f compose.smoke.yml up --build -d --wait
                  docker compose -p oap-ci-smoke -f compose.smoke.yml exec -T api python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/ready').status == 200"

            - name: Remove isolated smoke stack
              if: always()
              run: docker compose -p oap-ci-smoke -f compose.smoke.yml down -v

            - name: Upload evaluation report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: evaluation-report
                  path: evaluation-report.json
                  if-no-files-found: ignore
